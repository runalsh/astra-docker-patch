name: Build and Push Patch Images to DockerHub and GHCR

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_exists_check:
        description: 'Skip existence check and force rebuild/overwrite all images'
        type: boolean
        required: false
        default: false

jobs:
  select-runner:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      runner_type: ${{ steps.check.outputs.runner_type }}
    steps:
      - name: Check if phylex runner is online
        id: check
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(gh api "repos/${{ github.repository }}/actions/runners" 2>/dev/null || true)
          STATUS=$(echo "$RESPONSE" | jq -r '.runners[]? | select(.name=="phylex") | .status' 2>/dev/null || echo "offline")
          if [ "$STATUS" = "online" ]; then
            echo "Runner phylex is ONLINE."
            HAS_LABEL=$(echo "$RESPONSE" | jq -r '.runners[] | select(.name=="phylex") | .labels[]? | select(.name=="phylex") | .name' 2>/dev/null || true)
            if [ "$HAS_LABEL" = "phylex" ]; then
              echo 'runner_type=["self-hosted", "phylex"]' >> "$GITHUB_OUTPUT"
            else
              echo 'runner_type=["self-hosted"]' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Runner phylex is not available ($STATUS). Falling back to ubuntu-latest."
            echo 'runner_type=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_type) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build, verify and push images
        env:
          PUSH_TO_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          PUSH_TO_GHCR: 'true'
          CLEANUP_DOCKER_IMAGES: 'true'
          SKIP_EXISTS_CHECK: ${{ inputs.skip_exists_check || 'false' }}
        run: ./build.sh

      - name: Cleanup Temporary Files and Docker Images
        if: always()
        run: |
          sudo rm -rf /tmp/astra-patch_* temp_image_* 2>/dev/null || true
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^((ghcr\.io/)?runalsh/astra-patch)(:|$)' | xargs -r docker rmi -f 2>/dev/null || true
