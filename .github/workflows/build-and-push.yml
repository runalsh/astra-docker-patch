name: Build and Push Patch Images to DockerHub and GHCR

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_exists_check:
        description: 'Skip existence check and force rebuild/overwrite all images'
        type: boolean
        required: false
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build, verify and push images
        env:
          PUSH_TO_DOCKERHUB: 'true'
          PUSH_TO_GHCR: 'true'
          CLEANUP_DOCKER_IMAGES: 'true'
          SKIP_EXISTS_CHECK: ${{ inputs.skip_exists_check || 'false' }}
          ENABLE_TRIVY_SCAN: 'true'
        run: ./build.sh

      - name: Upload Trivy SBOM Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sbom-reports
          path: trivy-reports/
